services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: selaren
      POSTGRES_PASSWORD: selaren
      POSTGRES_DB: selaren
    ports:
      - "5432:5432"
    volumes:
      - selaren_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selaren"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  selaren_pg:
